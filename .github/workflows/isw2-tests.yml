# ISW2 coursework: builds the two modules that contain the classes under study and
# runs the test suites developed for them. Kept separate from the project's own
# ci.yml, which builds and tests the whole reactor.
name: ISW2 tests
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
  SKIPS: -Dcheckstyle.skip=true -Drat.skip=true -Dmaven.javadoc.skip=true
jobs:
  developed-tests:
    name: developed test suites (StringDistance, SelectImpl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build openjpa-lib, openjpa-kernel and openjpa-jdbc without tests
        run: mvn -B -pl openjpa-lib,openjpa-jdbc -am -DskipTests $SKIPS install
      - name: Run the developed suites
        run: >
          mvn -B -pl openjpa-lib,openjpa-jdbc $SKIPS
          -Dtest=StringDistanceTest,SelectImplTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Keep the Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-developed
          path: |
            openjpa-lib/target/surefire-reports
            openjpa-jdbc/target/surefire-reports
  module-baseline:
    name: full test suites of openjpa-lib and openjpa-jdbc
    runs-on: ubuntu-latest
    needs: developed-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build dependencies without tests
        run: mvn -B -pl openjpa-lib,openjpa-jdbc -am -DskipTests $SKIPS install
      - name: Run every test of the two modules
        run: mvn -B -pl openjpa-lib,openjpa-jdbc $SKIPS test
      - name: Keep the Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-modules
          path: |
            openjpa-lib/target/surefire-reports
            openjpa-jdbc/target/surefire-reports
